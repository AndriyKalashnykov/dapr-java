name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_call:
  # Weekly OWASP/NVD scan so new upstream advisories are caught even without
  # a code push. Monday 06:00 UTC keeps the cve-check job off the critical
  # path during weekday work hours.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # pull-requests: read is required for dorny/paths-filter on pull_request
  # events — without it, listFiles() fails with "Resource not accessible by
  # integration" and the changes job blocks every gated downstream job.
  pull-requests: read
  # packages: write is elevated only on the publish-images job (tags only).
  # Keeping the workflow-default at read minimizes blast radius on every
  # main/PR run.

env:
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  # Inspect the PR diff and expose which path groups changed. Downstream jobs
  # gate on `code` (binary skip-everything-on-docs-only) and `e2e` (the
  # heavy KinD job, off by default on PRs unless code under k8s/ / Java
  # sources / Makefile / workflow itself changed). The `run-e2e` label
  # remains a manual escape hatch for the rare "force-run e2e on a docs
  # change" case.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      # Tag pushes ALWAYS run all gated jobs. dorny/paths-filter compares
      # `base` (main) against `HEAD`; on a tag pointing at the current main
      # HEAD the diff is empty and `code`/`e2e` would emit `false`, silently
      # skipping every upstream job. The tag-only `docker` job's explicit
      # `if: startsWith(github.ref, 'refs/tags/v')` would then run against a
      # skipped needs-chain — ghost release with no validation. Forcing
      # `true` on tag pushes preserves the gate.
      code: ${{ startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.code == 'true' }}
      e2e: ${{ startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.e2e == 'true' }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Detect changed paths
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      id: filter
      with:
        # Set base only on push events. dorny/paths-filter ignores `base` on
        # pull_request events and emits a warning annotation; gating via the
        # template expression keeps push runs explicit while staying silent on
        # PRs. Required for `act push` (used by `make ci-run`) which has no
        # default base ref.
        base: ${{ github.event_name == 'push' && 'main' || '' }}
        filters: |
          code:
            - '!(**.md|docs/**|specs/**|LICENSE|.gitignore|.claudeignore|.claude/**|benchmarks/**|**.png|**.jpg|**.gif|**.svg)'
            - 'CLAUDE.md'
            # Re-include diagram sources (excluded by the docs/** negation above)
            # so static-check's diagrams-check drift gate runs on a .puml-only
            # change — including a Renovate C4-PlantUML / plantuml-image bump.
            # Otherwise such a change is classified docs-only, static-check is
            # skipped, and stale PNGs merge with a green (skipped) gate.
            - 'docs/diagrams/**/*.puml'
          e2e:
            - 'k8s/**'
            - 'k8s-dapr-shared/**'
            - 'pom.xml'
            - 'pizza-*/pom.xml'
            - 'pizza-*/src/**'
            - 'Makefile'
            - '.github/workflows/ci.yml'
            - 'e2e/**'
            - 'scripts/**'

  static-check:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven + trivy + gitleaks + kubeconform (pinned in
    # .mise.toml) for the static-check composite gate (format-check,
    # checkstyle, trivy-fs, trivy-config, secrets, diagrams-check,
    # mermaid-lint, k8s-validate). The act runner image has none of them
    # preinstalled.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    - name: Static check
      run: make static-check

  build:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven (pinned in .mise.toml) for the build. Required on
    # every `make`-running job per /ci-workflow §"jdx/mise-action coverage";
    # without it `mise install` hits GitHub's 60-req/hr anonymous limit on
    # aqua: backend lookups when adding new tools.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    - name: Build
      run: make build

    # Upload JAR artifacts ONLY on tag pushes. Non-tag runs don't need the
    # jars (they're only validating the build), so skip the upload to save
    # storage/bandwidth. Retention 1 day is just long enough for any
    # downstream release consumer.
    - name: Upload build artifacts
      if: ${{ startsWith(github.ref, 'refs/tags/') && vars.ACT != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: service-jars
        path: |
          pizza-delivery/target/*.jar
          pizza-kitchen/target/*.jar
          pizza-store/target/*.jar
        retention-days: 1

  # Unit tests only — fast feedback loop. Runs surefire (no Testcontainers
  # heavy lifting, no Dapr sidecars). Integration tests live in their own job.
  test:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven (pinned in .mise.toml). See `build` job for rationale.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    - name: Test
      run: make test

  # Integration tests via Failsafe + Testcontainers-Dapr. Runs in its own
  # runner to avoid resource contention with the unit-test job (Dapr sidecars
  # are memory-hungry and occasionally race their wait strategies under load).
  # Also produces the merged unit+IT JaCoCo coverage report and gates on the
  # 0.80 portfolio threshold.
  integration-test:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven (pinned in .mise.toml). See `build` job for rationale.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    - name: Integration test
      run: make coverage-generate

    - name: Verify coverage threshold
      run: make coverage-check

    - name: Upload coverage report
      if: ${{ always() && vars.ACT != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: coverage-report
        path: '**/target/site/jacoco/'
        retention-days: 14

  cve-check:
    needs: [static-check]
    # Gated to cut CI cost on every main push. Runs on:
    #   - tag pushes (release-time gate before shipping)
    #   - weekly schedule (catches new upstream CVEs in unchanged deps)
    #   - workflow_dispatch (ad-hoc rescan)
    # Skipped under act because the OWASP NVD download is slow and
    # unreliable in local containers; the step-level `if: !env.ACT` below
    # no-ops the actual scan.
    # Explicit `if:` strips the implicit success() gate; prefix `!failure() &&
    # !cancelled()` so a failed `static-check` blocks cve-check on a tag push.
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven (pinned in .mise.toml). See `build` job for rationale.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    # The NVD database is independent of the project's dependencies, so keying
    # it on pom.xml would evict the ~30-min download on every version bump.
    # Key on the ISO week instead so it refreshes weekly and survives dep bumps.
    - name: Compute NVD cache week
      id: nvdweek
      run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

    - name: Cache NVD database
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        # v2 prefix orphans the poisoned pre-2026-06-22 nvd-db-* tarballs: a
        # truncated odc.mv.db (interrupted NVD update tarred mid-write) was
        # propagating via restore-keys and hard-failing cve-check with an H2
        # MVStoreException (run 27938409200). Bump the prefix to invalidate a
        # poisoned cache; the Makefile cve-check purge-retry self-heals any
        # future corruption within the run.
        key: nvd-db-v2-${{ steps.nvdweek.outputs.week }}
        restore-keys: nvd-db-v2-

    # dependency-check 12.2.2 (2026-05-03) ships the upstream fix for the
    # NVD 9-digit nanosecond timestamp deserializer bug (PR #8427), so this
    # step is back to strict — failures block the release flow as designed.
    - name: OWASP dependency check
      if: ${{ !env.ACT }}
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        OSS_INDEX_USER: ${{ secrets.OSS_INDEX_USER }}
        OSS_INDEX_TOKEN: ${{ secrets.OSS_INDEX_TOKEN }}
      run: make cve-check

    - name: Upload CVE report
      if: ${{ always() && vars.ACT != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cve-report
        path: '**/target/dependency-check-report.html'
        retention-days: 14
        # Suppress ::warning when the scan fails before producing an HTML
        # report (see the NVD deserializer bug noted on the run step above).
        if-no-files-found: ignore

  # Per-push image scan (gates 1–3: Paketo CNB build + Trivy image scan +
  # Spring Boot boot-marker smoke test). The `docker` matrix job is
  # tag-gated, so without this sibling Paketo base-layer CVEs only surface
  # on release day. amd64-only, matching the tag-gated `docker` publish job.
  # Matrix per-service so each Paketo build (~2 min) runs in parallel.
  image-scan:
    needs: [changes, static-check]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [pizza-store, pizza-kitchen, pizza-delivery]

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven + trivy (pinned in .mise.toml) for the image
    # scan gate.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    # GATE 1+2: Paketo CNB build + Trivy image scan
    # (CRITICAL/HIGH blocking, fixed-only). SERVICES override scopes the
    # loop to this matrix entry only.
    - name: Build and scan image
      run: make image-scan SERVICES='${{ matrix.service }}'

    # GATE 3: Spring Boot boot-marker smoke test. Catches regressions Trivy
    # misses (missing classes, port bind, broken auto-config). Pizza
    # services depend on Dapr sidecars at runtime, so the readiness probe
    # would fail without them; the boot-marker fires BEFORE any
    # external-dep check, which is what we want here.
    - name: Smoke test
      run: |
        set -euo pipefail
        SVC='${{ matrix.service }}'
        docker run -d --name="${SVC}-smoke" "${SVC}:e2e"
        echo "Waiting up to 90s for Spring Boot to boot..."
        end=$((SECONDS + 90))
        while [ $SECONDS -lt $end ]; do
          if docker logs "${SVC}-smoke" 2>&1 | grep -qE 'Started [A-Z][a-zA-Z]+Application in|Tomcat started on port|Netty started on port'; then
            echo "PASS: ${SVC} container booted Spring Boot successfully"
            docker rm -f "${SVC}-smoke" >/dev/null
            exit 0
          fi
          sleep 3
        done
        echo "FAIL: ${SVC} did not reach Spring Boot start within 90s"
        docker logs "${SVC}-smoke"
        docker rm -f "${SVC}-smoke" >/dev/null || true
        exit 1

    - name: Cleanup smoke container
      if: always()
      run: docker rm -f '${{ matrix.service }}-smoke' 2>/dev/null || true

    # GATE 4: Paketo CNB image-contract assertions via container-
    # structure-test (USER nonroot, entrypoint /cnb/process/web,
    # /workspace/BOOT-INF layered-JAR layout, no /bin/sh or apt/curl
    # leaked from a non-distroless base). Catches regressions in the
    # Paketo upstream contract earlier than the runtime smoke test.
    - name: Structure test
      run: make image-test SERVICES='${{ matrix.service }}'

    # Tag-only: hand the *scanned* image to the `docker` publish job so it
    # doesn't rebuild it. `docker save | gzip` persists the exact image this
    # job built + Trivy-scanned + smoke- + structure-tested; the artifact is
    # loaded and pushed by `docker` AFTER the full validation chain is green
    # (build/test/integration-test/cve-check/e2e). No early registry push, so
    # a later gate failure leaves no orphaned tag. Skipped on PR/main pushes.
    - name: Save scanned image for publish
      if: startsWith(github.ref, 'refs/tags/v')
      run: docker save '${{ matrix.service }}:e2e' | gzip > '/tmp/${{ matrix.service }}-image.tar.gz'

    - name: Upload scanned image artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: image-${{ matrix.service }}
        path: /tmp/${{ matrix.service }}-image.tar.gz
        retention-days: 1

  # MANDATORY end-to-end test job. Deploys the three services plus Dapr to
  # a KinD cluster (cloud-provider-kind LB + redis-backed pubsub/state) and
  # runs e2e/e2e-test.sh through the LoadBalancer-exposed pizza-store.
  #
  # Trigger policy:
  #   - Every push to main and every tag push (baseline coverage)
  #   - Pull requests labelled `run-e2e` (opt-in for feature branches)
  #   - Pull requests where changes.e2e=='true' (e2e-relevant paths)
  #   - Manual runs via workflow_dispatch
  #
  # KinD + image-build + Dapr install runs ~10-15 min on GitHub runners, so
  # we keep it off every PR by default and rely on static-check/build/test
  # to catch most bugs early.
  e2e:
    needs: [changes, build, test]
    # Explicit `if:` strips GitHub's implicit success() gate, so a failed
    # `build`/`test` would otherwise NOT block e2e — prefix `!failure() &&
    # !cancelled()` (same guard as the docker job). Block form because an
    # `if:` starting with `!` is not valid YAML flow syntax.
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
        (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'run-e2e') || needs.changes.outputs.e2e == 'true')) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml (single
    # source of truth; alignment with .java-version + pom.xml is enforced by
    # `make check-java-alignment`). A dedicated ~/.m2 cache replaces the maven
    # cache that actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven + kind + kubectl + helm + trivy + gitleaks +
    # websocat + container-structure-test (pinned in .mise.toml) for the
    # KinD-based e2e flow.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    - name: End-to-end tests
      run: make e2e

    # DAST: ZAP baseline scan against the LB-exposed pizza-store. Runs only
    # AFTER the assertion suite passes — keeps total e2e wall-clock predictable
    # (ZAP baseline ~2 min) and avoids burning a full ZAP run on a broken
    # cluster. Baseline scan is passive (no fuzzing, no destructive payloads),
    # so safe to run against the live e2e LB. SARIF upload to the Security tab
    # makes findings reviewable per-PR. STRICT gate: pizza-store now ships the
    # baseline security headers (SecurityHeadersFilter) + Subresource-Integrity,
    # so the fixable findings are closed in code; the residual accepted findings
    # are documented in .zap/rules.tsv (IGNORE). fail_action: true + a clean
    # rules budget means a NEW finding (e.g. from a ZAP stable-image bump) fails
    # the e2e job — the promotion the upgrade backlog called for.
    - name: Resolve LoadBalancer IP
      id: lb
      run: |
        IP=$(kubectl get svc pizza-store -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "url=http://${IP}/" >> "$GITHUB_OUTPUT"

    - name: ZAP baseline scan
      uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
      with:
        target: ${{ steps.lb.outputs.url }}
        # .zap/rules.tsv documents the deliberately-accepted residual alerts
        # (IGNORE) so strict mode fails only on NEW/unbudgeted findings.
        rules_file_name: '.zap/rules.tsv'
        # Don't override -J/-w via cmd_options: the action always injects
        # `-J report_json.json -w report_md.md -r report_html.html` itself
        # and then validates those files post-run. Custom -J/-w in cmd_options
        # redirects ZAP's output away from the action's expected names,
        # making the action emit `##[error]File ... does not exist`.
        fail_action: true
        allow_issue_writing: false

    - name: Upload ZAP baseline report
      if: ${{ always() && vars.ACT != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: zap-baseline-report
        # zaproxy/action-baseline always produces these three files via its
        # internal `-J report_json.json -w report_md.md -r report_html.html`
        # invocation.
        path: |
          report_json.json
          report_md.md
          report_html.html
        retention-days: 14
        if-no-files-found: ignore

    - name: Collect diagnostics on failure
      if: failure()
      run: |
        mkdir -p /tmp/e2e-diag
        kubectl get pods -A -o wide > /tmp/e2e-diag/pods.txt 2>&1 || true
        kubectl get events -A --sort-by=.lastTimestamp > /tmp/e2e-diag/events.txt 2>&1 || true
        for svc in pizza-store-service pizza-kitchen-service pizza-delivery-service; do \
          kubectl logs -l app=$svc --all-containers=true --tail=500 > /tmp/e2e-diag/$svc.log 2>&1 || true; \
        done

    - name: Upload e2e diagnostics
      if: ${{ failure() && vars.ACT != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e2e-diagnostics
        path: /tmp/e2e-diag/
        retention-days: 7

  # Drift-check for the ALTERNATE "shared sidecar" Dapr topology
  # (k8s-dapr-shared/) — standalone shared daprd per app-id (dapr-shared-chart)
  # instead of per-pod injected sidecars. The default topology's `e2e` job covers
  # PRs; `make k8s-validate` parse-validates the shared manifests on every push.
  # This job actually RUNS the shared topology so a RUNTIME regression (bad image
  # ref, Dapr annotation, dapr-shared wiring, probe) surfaces without a hand-run.
  # Gated to the weekly schedule + workflow_dispatch only — keeps a second full
  # KinD e2e off the per-PR critical path.
  e2e-shared:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # Java + Maven are provisioned by jdx/mise-action from .mise.toml. A dedicated
    # ~/.m2 cache replaces the maven cache actions/setup-java used to provide.
    - name: Cache Maven packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    # mise provides Maven + kind + kubectl + helm (pinned in .mise.toml) for the
    # KinD-based shared-topology e2e flow.
    - name: Install mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install: true
        cache: true

    # `make e2e-shared` loads pre-built :e2e images into KinD, so build them
    # first (the default `e2e` job builds via kind-deploy; the shared path does
    # not).
    - name: Build images
      run: make image-build

    # Shared-sidecar topology (k8s-dapr-shared/) — standalone daprd per app-id
    - name: End-to-end tests
      run: make e2e-shared

    - name: Collect diagnostics on failure
      if: failure()
      run: |
        mkdir -p /tmp/e2e-shared-diag
        kubectl get pods -A -o wide > /tmp/e2e-shared-diag/pods.txt 2>&1 || true
        kubectl get events -A --sort-by=.lastTimestamp > /tmp/e2e-shared-diag/events.txt 2>&1 || true
        for svc in pizza-store-service pizza-kitchen-service pizza-delivery-service; do \
          kubectl logs -l app=$svc --all-containers=true --tail=500 > /tmp/e2e-shared-diag/$svc.log 2>&1 || true; \
        done
        kubectl logs -l app.kubernetes.io/name=dapr-shared-chart --all-containers=true --tail=500 > /tmp/e2e-shared-diag/dapr-shared.log 2>&1 || true

    - name: Upload e2e-shared diagnostics
      if: ${{ failure() && vars.ACT != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e2e-shared-diagnostics
        path: /tmp/e2e-shared-diag/
        retention-days: 7

  # First-party OCI image publish with pre-push hardening gates. Triggers
  # only on v* tag pushes and only after every validation job is green.
  # This job does NOT rebuild the image — it reuses the exact image the
  # `image-scan` job already built + Trivy-scanned + smoke- + structure-
  # tested (handed over as a gzip'd `docker save` artifact). It only
  # `docker load`s + pushes the `:<version>-amd64` staging tag. Publishing
  # still gates on the full validation chain via `needs:` (build/test/
  # integration-test/cve-check/e2e), and `needs: image-scan` guarantees the
  # scan gate passed and the artifact exists. The downstream
  # `docker-manifest` job then promotes the staging tag to `:<version>` +
  # `:latest` and cosign-signs the image digest.
  #
  # amd64-only: spring-boot:build-image (Paketo CNB) builds the host arch
  # with no cross-build support, and arm64 publishing was intentionally
  # dropped.
  docker:
    needs: [static-check, build, test, integration-test, cve-check, e2e, image-scan]
    # Explicit `if:` strips GitHub's implicit success() check — must
    # re-assert !failure() && !cancelled() so a failed needs-chain on a
    # tag push blocks the publish path. Block form because single-line
    # `if:` starting with `!` is not valid YAML.
    if: |
      !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false      # one bad service shouldn't cancel the others'
                            # in-flight pushes — collect all results
      matrix:
        service: [pizza-store, pizza-kitchen, pizza-delivery]
    env:
      REGISTRY: ghcr.io

    steps:
    - name: Compute version tag
      id: ver
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Compute lowercase image namespace
      id: ns
      # OCI registries require lowercase image names. GitHub Actions has no
      # built-in expression to case-convert ${{ github.repository_owner }},
      # so we lowercase via shell.
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

    # Reuse the scanned image from `image-scan` (this service's artifact) —
    # no Paketo rebuild, no re-scan. `docker load` restores it as `<svc>:e2e`.
    - name: Download scanned image
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: image-${{ matrix.service }}
        path: /tmp
    - name: Load scanned image
      run: docker load < '/tmp/${{ matrix.service }}-image.tar.gz'

    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push amd64 staging tag
      env:
        SVC: ${{ matrix.service }}
        VERSION: ${{ steps.ver.outputs.version }}
        OWNER: ${{ steps.ns.outputs.owner }}
        REPO: ${{ steps.ns.outputs.repo }}
      run: |
        set -euo pipefail
        # Repo-namespace (ghcr.io/<owner>/<repo>/<package>) — GITHUB_TOKEN
        # can create new packages here on first push; user-namespace cannot.
        src="${SVC}:e2e"
        dst="${REGISTRY}/${OWNER}/${REPO}/${SVC}:${VERSION}-amd64"
        echo "--- ${src} → ${dst} ---"
        docker tag "${src}" "${dst}"
        docker push "${dst}"

  # Promote each service's amd64 staging tag to the clean `:<version>` +
  # `:latest` tags and cosign-sign the image digest. Runs once per service
  # after the `docker` push succeeds. Signing happens here (not in `docker`)
  # so the clean published tags are always the signed ones.
  docker-manifest:
    needs: docker
    # Same rationale as the `docker` job — explicit `if:` strips implicit
    # success() check, so a partial-failure in the per-service matrix must
    # still block promotion + signing.
    if: |
      !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless OIDC (Sigstore Fulcio)
    strategy:
      fail-fast: false
      matrix:
        service: [pizza-store, pizza-kitchen, pizza-delivery]
    env:
      REGISTRY: ghcr.io

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Compute version tag
      id: ver
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Compute lowercase image namespace
      id: ns
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
        echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Promote amd64 image to clean tags
      id: manifest
      env:
        SVC: ${{ matrix.service }}
        VERSION: ${{ steps.ver.outputs.version }}
        OWNER: ${{ steps.ns.outputs.owner }}
        REPO: ${{ steps.ns.outputs.repo }}
      run: |
        set -euo pipefail
        base="${REGISTRY}/${OWNER}/${REPO}/${SVC}"
        amd64_ref="${base}:${VERSION}-amd64"
        ver_tag="${base}:${VERSION}"
        latest_tag="${base}:latest"
        # imagetools create retags the amd64 staging image to `:VERSION` and
        # `:latest` (same digest, single source). -t may be repeated to push
        # multiple tags in one call.
        docker buildx imagetools create \
          -t "${ver_tag}" \
          -t "${latest_tag}" \
          "${amd64_ref}"
        DIGEST=$(docker buildx imagetools inspect "${ver_tag}" --format '{{ .Manifest.Digest }}')
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        {
          echo 'tags<<TAGS_EOF'
          echo "${ver_tag}"
          echo "${latest_tag}"
          echo 'TAGS_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # Keyless OIDC signing via Sigstore Fulcio — no key material to manage,
    # signature provenance recorded in the public Rekor transparency log.
    # Sign the amd64 image digest shared by the `:VERSION` and `:latest` tags.
    - name: Sign image with cosign
      env:
        TAGS: ${{ steps.manifest.outputs.tags }}
        DIGEST: ${{ steps.manifest.outputs.digest }}
      run: |
        set -euo pipefail
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          echo "→ cosign sign ${tag}@${DIGEST}"
          cosign sign --yes "${tag}@${DIGEST}"
        done <<< "${TAGS}"

  ci-pass:
    if: always()
    needs: [changes, static-check, build, test, integration-test, cve-check, image-scan, e2e, e2e-shared, docker, docker-manifest]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          # docker + docker-manifest are tag-gated; treat their 'skipped'
          # result on non-tag runs as a pass. Code-gated jobs
          # (static-check/build/test/IT/image-scan) are also legitimately
          # 'skipped' on docs-only PRs. Any 'failure'/'cancelled' fails the gate.
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs were cancelled"
            exit 1
          fi
