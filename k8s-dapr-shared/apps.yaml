apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-delivery-deployment
spec:
  selector:
    matchLabels:
      app: pizza-delivery-service
  template:
    metadata:
      annotations:  
        # dapr.io/app-id: delivery-service
        # dapr.io/app-port: "8080"
        # dapr.io/enabled: "true"
        # dapr.io/log-level: "debug"
      labels:
        app: pizza-delivery-service
        app.kubernetes.io/name: pizza-delivery-service
        app.kubernetes.io/part-of: pizza-delivery-service
        app.kubernetes.io/version: 0.1.0
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: pizza-delivery-service
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: ghcr.io/andriykalashnykov/dapr-java/pizza-delivery:0.1.0
        imagePullPolicy: Always
        env:
        - name: JAVA_OPTS
          value: "-XX:+UseParallelGC -XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75 -XX:TieredStopAtLevel=1"
        # OTLP tracing endpoint — same as the default k8s/ topology; without it
        # the services emit no spans and the e2e Jaeger assertion fails. (Was
        # missing from this shared-topology manifest.)
        - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
          value: http://jaeger:4318/v1/traces
        - name: DAPR_HTTP_ENDPOINT
          value: http://delivery-service-dapr.default.svc.cluster.local:3500
        - name: DAPR_GRPC_ENDPOINT
          value: http://delivery-service-dapr.default.svc.cluster.local:50001
        - name: PUB_SUB_NAME
          value: pubsub     
        - name: PUB_SUB_TOPIC
          value: topic    
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
spec:
  selector:
    app: pizza-delivery-service
  ports:
  - port: 80
    targetPort: 8080

