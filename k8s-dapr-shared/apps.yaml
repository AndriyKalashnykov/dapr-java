apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-store-deployment
spec:
  selector:
    matchLabels:
      app: pizza-store-service
  template:
    metadata:
      annotations:  
        # dapr.io/app-id: pizza-store
        # dapr.io/app-port: "8080"
        # dapr.io/enabled: "true"
        # dapr.io/log-level: "debug"
      labels:
        app: pizza-store-service
        app.kubernetes.io/name: pizza-store-service
        app.kubernetes.io/part-of: pizza-store-service
        app.kubernetes.io/version: 0.1.0
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: pizza-store-service
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: ghcr.io/andriykalashnykov/dapr-java/pizza-store:0.1.0
        imagePullPolicy: Always
        env:
        - name: JAVA_OPTS
          value: "-XX:+UseParallelGC -XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75 -XX:TieredStopAtLevel=1"
        # OTLP tracing endpoint — same as the default k8s/ topology; without it
        # the services emit no spans and the e2e Jaeger assertion fails. (Was
        # missing from this shared-topology manifest.)
        - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
          value: http://jaeger:4318/v1/traces
        - name: DAPR_HTTP_ENDPOINT
          value: http://pizza-store-dapr.default.svc.cluster.local:3500
        - name: DAPR_GRPC_ENDPOINT
          value: http://pizza-store-dapr.default.svc.cluster.local:50001
        - name: STATE_STORE_NAME
          value: kvstore
        # Maps to Spring placeholder ${cors.allowed-origins} read by @CrossOrigin
        # in PizzaStore.java. Override per-environment.
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:5173"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        ports:
        - containerPort: 8080
        # Writable /tmp for embedded Tomcat's work dir — required because the
        # container runs with readOnlyRootFilesystem: true. pizza-kitchen and
        # pizza-delivery (and the default k8s/ topology) already mount this; it
        # was missing here, so pizza-store crashed on startup with
        # "java.io.tmpdir ... /tmp/tomcat.8080...: Read-only file system".
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pizza-store
spec:
  selector:
    app: pizza-store-service
  ports:
  - port: 80
    targetPort: 8080